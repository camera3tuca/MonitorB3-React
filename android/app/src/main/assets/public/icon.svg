<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="chartGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="bullGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bearRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
  </defs>

  <!-- Background with smooth rounded container -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="92" fill="none" stroke="#334155" stroke-width="4"/>

  <!-- Subtle grid lines -->
  <line x1="60" y1="150" x2="452" y2="150" stroke="#334155" stroke-width="2" stroke-dasharray="6,6" opacity="0.35"/>
  <line x1="60" y1="240" x2="452" y2="240" stroke="#334155" stroke-width="2" stroke-dasharray="6,6" opacity="0.35"/>
  <line x1="60" y1="330" x2="452" y2="330" stroke="#334155" stroke-width="2" stroke-dasharray="6,6" opacity="0.35"/>

  <!-- Candlesticks & Bullish Rebound Formation -->
  <!-- Candle 1: Red falling -->
  <line x1="110" y1="170" x2="110" y2="300" stroke="#f43f5e" stroke-width="5"/>
  <rect x="94" y="195" width="32" height="80" rx="4" fill="url(#bearRed)"/>

  <!-- Candle 2: Red oversold dip -->
  <line x1="180" y1="220" x2="180" y2="370" stroke="#f43f5e" stroke-width="5"/>
  <rect x="164" y="245" width="32" height="95" rx="4" fill="url(#bearRed)"/>

  <!-- Candle 3: Hammer / Reversal Pinbar (Sobrevenda B3) -->
  <line x1="250" y1="280" x2="250" y2="410" stroke="#38bdf8" stroke-width="5"/>
  <rect x="234" y="285" width="32" height="40" rx="4" fill="#38bdf8"/>

  <!-- Candle 4: Green surging breakout -->
  <line x1="320" y1="190" x2="320" y2="340" stroke="#10b981" stroke-width="5"/>
  <rect x="304" y="210" width="32" height="100" rx="4" fill="url(#bullGreen)"/>

  <!-- Candle 5: Strong green bull rally -->
  <line x1="390" y1="110" x2="390" y2="260" stroke="#10b981" stroke-width="5"/>
  <rect x="374" y="130" width="32" height="105" rx="4" fill="url(#bullGreen)"/>

  <!-- Dynamic Swing Trading Exponential Trend Curve -->
  <path d="M 100 240 Q 220 420 395 130" fill="none" stroke="url(#chartGlow)" stroke-width="14" stroke-linecap="round"/>
  <!-- Arrow Head -->
  <polygon points="415,110 380,128 398,158" fill="#10b981"/>

  <!-- B3 Badge -->
  <g transform="translate(60, 65)">
    <rect width="115" height="40" rx="10" fill="#2563eb" opacity="0.95"/>
    <text x="57" y="26" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="1.5">B3 PRO</text>
  </g>
</svg>
