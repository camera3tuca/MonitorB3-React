name: Gerar Android App Bundle (.aab)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependencias e Gerar Build Web
        run: |
          npm ci
          npm run build
          npx cap copy android

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Compilar AAB Oficial (Release Assinado)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Disponibilizar o .AAB para Download
        uses: actions/upload-artifact@v4
        with:
          name: MonitorB3-v1.0.4-release
          path: android/app/build/outputs/bundle/release/*.aab
