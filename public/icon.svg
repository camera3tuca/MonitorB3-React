<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="chartGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="bullGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="4"/>

  <!-- Subtle grid lines -->
  <line x1="80" y1="160" x2="432" y2="160" stroke="#334155" stroke-width="2" stroke-dasharray="6,6" opacity="0.4"/>
  <line x1="80" y1="240" x2="432" y2="240" stroke="#334155" stroke-width="2" stroke-dasharray="6,6" opacity="0.4"/>
  <line x1="80" y1="320" x2="432" y2="320" stroke="#334155" stroke-width="2" stroke-dasharray="6,6" opacity="0.4"/>

  <!-- Candlesticks & Bullish Rebound -->
  <!-- Red falling candle 1 -->
  <line x1="120" y1="180" x2="120" y2="300" stroke="#f43f5e" stroke-width="4"/>
  <rect x="106" y="200" width="28" height="70" rx="4" fill="#f43f5e"/>

  <!-- Red falling candle 2 (Oversold Dip) -->
  <line x1="180" y1="230" x2="180" y2="360" stroke="#f43f5e" stroke-width="4"/>
  <rect x="166" y="250" width="28" height="85" rx="4" fill="#f43f5e"/>

  <!-- Hammer / Reversal Pinbar candle 3 -->
  <line x1="240" y1="290" x2="240" y2="400" stroke="#38bdf8" stroke-width="4"/>
  <rect x="226" y="295" width="28" height="35" rx="4" fill="#38bdf8"/>

  <!-- Green surging candle 4 -->
  <line x1="300" y1="200" x2="300" y2="340" stroke="#10b981" stroke-width="4"/>
  <rect x="286" y="220" width="28" height="90" rx="4" fill="#10b981"/>

  <!-- Green strong breakout candle 5 -->
  <line x1="360" y1="130" x2="360" y2="270" stroke="#10b981" stroke-width="4"/>
  <rect x="346" y="150" width="28" height="95" rx="4" fill="#10b981"/>

  <!-- Dynamic Swing Curve Arrow -->
  <path d="M 120 235 Q 220 400 375 140" fill="none" stroke="url(#chartGlow)" stroke-width="12" stroke-linecap="round" filter="url(#shadow)"/>
  <polygon points="385,125 355,145 375,170" fill="#10b981"/>

  <!-- Target Badge B3 -->
  <g transform="translate(80, 75)">
    <rect width="110" height="36" rx="10" fill="#2563eb" opacity="0.9"/>
    <text x="55" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" text-anchor="middle" letter-spacing="1.5">B3 PRO</text>
  </g>
</svg>
