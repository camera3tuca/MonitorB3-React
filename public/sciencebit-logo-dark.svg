<svg xmlns='http://www.w3.org/2000/svg' viewBox='80 12 240 64' width='240' height='64'>
  <defs>
    <style>
      .txt-sci {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-size: 50px;
        font-weight: 800;
        letter-spacing: -1px;
        fill: #000000;
        text-anchor: middle;
      }
      .txt-bit {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-size: 50px;
        font-weight: 800;
        letter-spacing: -0.5px;
        fill: #0055ff;
      }
      .txt-comp {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-size: 13.5px;
        font-weight: 800;
        letter-spacing: 6px;
        fill: #000000;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Line 1: ScienceBit perfectly centered at x=201.5 -->
  <text class='txt-sci' x='201.5' y='52'>Science<tspan class='txt-bit'>Bit</tspan></text>

  <!-- Line 2: Symmetrically centered bars and COMPUTER -->
  <line x1='83' y1='71' x2='140' y2='71' stroke='#0055ff' stroke-width='3.5' stroke-linecap='round'/>
  <text class='txt-comp' x='200' y='75.5'>COMPUTER</text>
  <line x1='260' y1='71' x2='317' y2='71' stroke='#0055ff' stroke-width='3.5' stroke-linecap='round'/>
</svg>