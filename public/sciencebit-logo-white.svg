<svg xmlns='http://www.w3.org/2000/svg' viewBox='124 24 352 102' width='352' height='102'>
  <defs>
    <style>
      .txt-sci {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 72px;
        font-weight: 800;
        letter-spacing: -1.5px;
        fill: #ffffff;
        text-anchor: middle;
      }
      .txt-bit {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 72px;
        font-weight: 800;
        letter-spacing: -1px;
        fill: #1d72fe;
      }
      .txt-comp {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 19px;
        font-weight: 800;
        letter-spacing: 13px;
        fill: #ffffff;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Line 1: ScienceBit -->
  <text class='txt-sci' x='302' y='82'>Science<tspan class='txt-bit'>Bit</tspan></text>

  <!-- Line 2: Symmetrically spaced bars and COMPUTER (zero overlap with C or R) -->
  <line x1='131' y1='114' x2='188' y2='114' stroke='#1d72fe' stroke-width='4' stroke-linecap='round'/>
  <text class='txt-comp' x='307' y='121'>COMPUTER</text>
  <line x1='412' y1='114' x2='469' y2='114' stroke='#1d72fe' stroke-width='4' stroke-linecap='round'/>
</svg>